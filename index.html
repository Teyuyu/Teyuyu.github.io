<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>首页</title>
	<style>
						.auth-dropdown {
							position: relative;
							display: inline-block;
						}
						.auth-dropdown-content {
							display: none;
							position: absolute;
							right: 0;
							top: 110%;
							background: rgba(255,255,255,0.95);
							min-width: 100px;
							box-shadow: 0 2px 8px rgba(0,0,0,0.08);
							border-radius: 8px;
							z-index: 1001;
							padding: 6px 0;
						}
						.auth-dropdown-content button {
							background: none;
							color: #3498db;
							border: none;
							width: 100%;
							text-align: left;
							padding: 8px 18px;
							font-size: 14px;
							border-radius: 0;
							cursor: pointer;
							transition: background 0.2s;
						}
						.auth-dropdown-content button:hover {
							background: #eaf6ff;
						}
						.auth-dropdown.show .auth-dropdown-content {
							display: block;
						}
				.auth-buttons-group {
					display: flex;
					align-items: center;
					background: rgba(255,255,255,0.5);
					border-radius: 10px;
					box-shadow: 0 2px 8px rgba(0,0,0,0.04);
					padding: 6px 16px;
					backdrop-filter: blur(2px);
				}
		body {
			margin: 0;
			font-family: Arial, sans-serif;
			min-height: 100vh;
			background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
			background-image: url('images/th.jpg'), linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
			background-repeat: no-repeat;
			background-position: center center;
			background-size: cover;
			background-attachment: fixed;
		}
		.auth-buttons {
			position: absolute;
			top: 16px;
			right: 32px;
			z-index: 1000;
		}
		.auth-buttons button {
			margin-left: 6px;
			padding: 3px 10px;
			border: none;
			border-radius: 3px;
			background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
			color: #3498db;
			font-size: 13px;
			cursor: pointer;
			transition: background 0.2s, color 0.2s;
		}
		.auth-buttons button:hover {
			background: linear-gradient(135deg, #c2e9fb 0%, #a1c4fd 100%);
			color: #217dbb;
		}
	</style>
</head>
<body>
	<div class="auth-buttons">
		<div class="auth-dropdown" id="authDropdown">
			<button onclick="toggleAuthDropdown()">登录/注册</button>
			<div class="auth-dropdown-content" id="authDropdownContent">
				<button onclick="alert('登录功能待实现')">登录</button>
				<button onclick="alert('注册功能待实现')">注册</button>
			</div>
		</div>
	</div>

	<script>
		function toggleAuthDropdown() {
			var dropdown = document.getElementById('authDropdown');
			dropdown.classList.toggle('show');
		}
		// 点击外部关闭下拉
		document.addEventListener('click', function(event) {
			var dropdown = document.getElementById('authDropdown');
			if (!dropdown.contains(event.target)) {
				dropdown.classList.remove('show');
			}
		});
	</script>
    <a href="video.html" style="text-align: center;color: #9ed0f1;">去分页</a>
</body>
</html>
