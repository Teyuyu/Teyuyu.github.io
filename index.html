<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>万能鱼 - 登录</title>
  <!-- 51.la 统计 -->
  <script charset="UTF-8" id="LA_COLLECT" src="//sdk.51.la/js-sdk-pro.min.js"></script>
  <script>LA.init({id:"3OVoIvCjhMMCOjuH",ck:"3OVoIvCjhMMCOjuH",autoTrack:true,hashMode:true})</script>

  <!-- Favicon -->
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
  <link rel="icon" href="favicon-32x32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="favicon-64x64.png" type="image/png" sizes="64x64">
  <link rel="apple-touch-icon" href="apple-touch-icon-180x180.png" sizes="180x180">
  <meta name="theme-color" content="#1690FF">

  <style>
    :root {
      --primary: #1690FF;
      --primary-dark: #0d7ae6;
      --primary-light: #4da6ff;
      --success: #10b981;
      --error: #ef4444;
      --text-primary: #1f2937;
      --text-secondary: #6b7280;
      --bg-white: #ffffff;
      --bg-gray: #f9fafb;
      --border: #e5e7eb;
      --shadow: rgba(0, 0, 0, 0.1);
      --shadow-lg: rgba(0, 0, 0, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      overflow-x: hidden;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", "Noto Sans SC", sans-serif;
      color: var(--text-primary);
      background: linear-gradient(135deg, #667eea 0%, #764ba2 25%, #f093fb 50%, #4facfe 75%, #00f2fe 100%);
      background-size: 400% 400%;
      animation: gradientShift 15s ease infinite;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      position: relative;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* 登录容器 */
    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      z-index: 1;
    }

    .login-card {
      background: var(--bg-white);
      border-radius: 20px;
      box-shadow: 0 20px 60px var(--shadow-lg), 0 0 0 1px rgba(255, 255, 255, 0.1);
      padding: 48px 40px;
      width: 100%;
      max-width: 440px;
      animation: slideUp 0.5s ease-out;
      position: relative;
      overflow: hidden;
    }

    .login-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--primary), var(--primary-light));
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .login-header {
      text-align: center;
      margin-bottom: 36px;
    }

    .login-logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      color: white;
      font-weight: bold;
      box-shadow: 0 8px 20px rgba(22, 144, 255, 0.3);
    }

    .login-header h1 {
      font-size: 28px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    .login-header p {
      font-size: 15px;
      color: var(--text-secondary);
      margin: 0;
    }

    /* 表单样式 */
    .form-group {
      margin-bottom: 24px;
      position: relative;
    }

    .form-label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-primary);
      margin-bottom: 8px;
    }

    .form-input {
      width: 100%;
      padding: 14px 16px;
      font-size: 15px;
      border: 2px solid var(--border);
      border-radius: 12px;
      background: var(--bg-white);
      color: var(--text-primary);
      transition: all 0.2s ease;
      outline: none;
    }

    .form-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(22, 144, 255, 0.1);
    }

    .form-input::placeholder {
      color: var(--text-secondary);
    }

    .password-toggle {
      position: absolute;
      right: 12px;
      top: 42px;
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      padding: 8px;
      display: flex;
      align-items: center;
      transition: color 0.2s;
    }

    .password-toggle:hover {
      color: var(--primary);
    }

    .error-message {
      color: var(--error);
      font-size: 13px;
      margin-top: 8px;
      min-height: 20px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .error-message::before {
      content: '⚠';
      font-size: 14px;
    }

    /* 按钮样式 */
    .btn {
      width: 100%;
      padding: 14px 24px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: white;
      box-shadow: 0 4px 12px rgba(22, 144, 255, 0.4);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(22, 144, 255, 0.5);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .btn-loading {
      pointer-events: none;
    }

    .btn-loading::after {
      content: '';
      position: absolute;
      width: 16px;
      height: 16px;
      top: 50%;
      left: 50%;
      margin-left: -8px;
      margin-top: -8px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* 主内容区域（登录后显示） */
    .main-content {
      display: none;
      min-height: 100vh;
      padding: 40px 20px;
    }

    .main-content.active {
      display: block;
    }

    .content-header {
      max-width: 1200px;
      margin: 0 auto 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-white);
      padding: 20px 32px;
      border-radius: 16px;
      box-shadow: 0 4px 12px var(--shadow);
    }

    .content-header h1 {
      font-size: 24px;
      font-weight: 700;
      color: var(--text-primary);
      margin: 0;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .user-greeting {
      color: var(--text-secondary);
      font-size: 15px;
    }

    .btn-logout {
      padding: 10px 20px;
      background: var(--bg-gray);
      border: 2px solid var(--border);
      border-radius: 10px;
      color: var(--text-primary);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-logout:hover {
      background: #f3f4f6;
      border-color: var(--text-secondary);
    }

    .content-body {
      max-width: 1200px;
      margin: 0 auto;
      background: var(--bg-white);
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 4px 12px var(--shadow);
    }

    .hero-image {
      width: 100%;
      max-width: 800px;
      height: auto;
      border-radius: 12px;
      margin: 0 auto;
      display: block;
      box-shadow: 0 8px 24px var(--shadow);
    }

    /* 浮动统计窗 */
    .stat-float {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 1200;
      background: var(--bg-white);
      border-radius: 12px;
      box-shadow: 0 8px 30px var(--shadow-lg);
      overflow: hidden;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .stat-float.collapsed {
      width: 56px;
      height: 56px;
      padding: 8px;
      border-radius: 12px;
    }

    .stat-toggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-white);
      cursor: pointer;
      transition: all 0.2s;
    }

    .stat-toggle:hover {
      background: var(--bg-gray);
    }

    .stat-panel {
      width: 320px;
      max-width: calc(100vw - 40px);
      max-height: 360px;
      overflow: auto;
      padding: 16px;
      display: none;
    }

    .stat-close {
      background: transparent;
      border: 0;
      color: var(--text-secondary);
      cursor: pointer;
      padding: 8px;
      font-size: 14px;
      transition: color 0.2s;
    }

    .stat-close:hover {
      color: var(--text-primary);
    }

    /* 页脚 */
    .site-footer {
      margin-top: 40px;
      padding: 24px 0;
      color: var(--text-secondary);
      font-size: 14px;
      text-align: center;
    }

    .site-footer a {
      color: var(--primary);
      text-decoration: none;
      transition: color 0.2s;
    }

    .site-footer a:hover {
      color: var(--primary-dark);
      text-decoration: underline;
    }

    /* 响应式设计 */
    @media (max-width: 640px) {
      .login-card {
        padding: 36px 24px;
        border-radius: 16px;
      }

      .login-header h1 {
        font-size: 24px;
      }

      .login-logo {
        width: 56px;
        height: 56px;
        font-size: 28px;
      }

      .content-header {
        flex-direction: column;
        gap: 16px;
        align-items: flex-start;
        padding: 20px;
      }

      .user-info {
        width: 100%;
        justify-content: space-between;
      }

      .content-body {
        padding: 24px 16px;
      }
    }

    /* 背景装饰 */
    .bg-decoration {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .bg-circle {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      animation: float 20s infinite ease-in-out;
    }

    .bg-circle:nth-child(1) {
      width: 300px;
      height: 300px;
      top: -100px;
      left: -100px;
      animation-delay: 0s;
    }

    .bg-circle:nth-child(2) {
      width: 200px;
      height: 200px;
      bottom: -50px;
      right: -50px;
      animation-delay: 5s;
    }

    .bg-circle:nth-child(3) {
      width: 150px;
      height: 150px;
      top: 50%;
      right: 10%;
      animation-delay: 10s;
    }

    @keyframes float {
      0%, 100% {
        transform: translate(0, 0) scale(1);
      }
      33% {
        transform: translate(30px, -30px) scale(1.1);
      }
      66% {
        transform: translate(-20px, 20px) scale(0.9);
      }
    }
  </style>
</head>
<body>
  <!-- 背景装饰 -->
  <div class="bg-decoration">
    <div class="bg-circle"></div>
    <div class="bg-circle"></div>
    <div class="bg-circle"></div>
  </div>

  <!-- 登录界面 -->
  <div class="login-container" id="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo">🐟</div>
        <h1>欢迎回来</h1>
        <p>请登录您的账户以继续</p>
      </div>

      <form id="login-form" onsubmit="return false;">
        <div class="form-group">
          <label class="form-label" for="username">用户名</label>
          <input
            type="text"
            id="username"
            class="form-input"
            placeholder="请输入用户名"
            autocomplete="username"
            required
            autofocus
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="password">密码</label>
          <div style="position: relative;">
            <input
              type="password"
              id="password"
              class="form-input"
              placeholder="请输入密码"
              autocomplete="current-password"
              required
            />
            <button
              type="button"
              class="password-toggle"
              id="password-toggle"
              aria-label="显示/隐藏密码"
            >
              👁️
            </button>
          </div>
        </div>

        <div class="error-message" id="error-message" role="alert"></div>

        <button type="submit" class="btn btn-primary" id="login-submit">
          <span id="login-text">登录</span>
        </button>
      </form>
    </div>
  </div>

  <!-- 主内容区域（登录后显示） -->
  <div class="main-content" id="main-content">
    <div class="content-header">
      <h1>万能鱼</h1>
      <div class="user-info">
        <span class="user-greeting" id="user-greeting">欢迎，用户</span>
        <button class="btn-logout" id="logout-btn">登出</button>
      </div>
    </div>

    <div class="content-body">
      <img src="images/th.jpg" alt="风景" class="hero-image">
    </div>

    <footer class="site-footer">
      <p>© 2025 万能鱼 · <a href="#">隐私政策</a> · <a href="#">关于</a></p>
    </footer>
  </div>

  <!-- 浮动统计窗 -->
  <div class="stat-float collapsed" id="stat-float">
    <div style="display: flex; align-items: center; gap: 8px; padding: 8px;">
      <button class="stat-toggle" id="stat-toggle" aria-label="打开统计面板" aria-expanded="false" title="网站统计">
        <svg width="20" height="14" viewBox="0 0 20 14" aria-hidden="true">
          <rect x="0" y="2" width="20" height="2" rx="1" fill="#222"/>
          <rect x="0" y="6" width="20" height="2" rx="1" fill="#222"/>
          <rect x="0" y="10" width="14" height="2" rx="1" fill="#222"/>
        </svg>
      </button>
    </div>
    <div class="stat-panel" id="stat-panel">
      <div id="stat-content"></div>
      <div style="text-align: right; margin-top: 8px;">
        <button class="stat-close" id="stat-close" aria-label="关闭统计" title="关闭">关闭</button>
      </div>
    </div>
  </div>

  <script>
    (function() {
      // 登录功能
      const loginContainer = document.getElementById('login-container');
      const mainContent = document.getElementById('main-content');
      const loginForm = document.getElementById('login-form');
      const usernameInput = document.getElementById('username');
      const passwordInput = document.getElementById('password');
      const passwordToggle = document.getElementById('password-toggle');
      const loginSubmit = document.getElementById('login-submit');
      const loginText = document.getElementById('login-text');
      const errorMessage = document.getElementById('error-message');
      const userGreeting = document.getElementById('user-greeting');
      const logoutBtn = document.getElementById('logout-btn');

      // 密码显示/隐藏切换
      passwordToggle.addEventListener('click', function() {
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);
        passwordToggle.textContent = type === 'password' ? '👁️' : '🙈';
      });

      // 检查登录状态
      function checkAuth() {
        const authUser = localStorage.getItem('authUser');
        if (authUser) {
          showMainContent(authUser);
        }
      }

      // 显示主内容
      function showMainContent(username) {
        loginContainer.style.display = 'none';
        mainContent.classList.add('active');
        userGreeting.textContent = '欢迎，' + username;
      }

      // 显示登录界面
      function showLogin() {
        loginContainer.style.display = 'flex';
        mainContent.classList.remove('active');
        usernameInput.value = '';
        passwordInput.value = '';
        errorMessage.textContent = '';
      }

      // 登录处理
      loginForm.addEventListener('submit', function(e) {
        e.preventDefault();
        
        const username = usernameInput.value.trim();
        const password = passwordInput.value;

        // 清除错误信息
        errorMessage.textContent = '';

        // 验证
        if (!username) {
          errorMessage.textContent = '请输入用户名';
          usernameInput.focus();
          return;
        }

        if (!password) {
          errorMessage.textContent = '请输入密码';
          passwordInput.focus();
          return;
        }

        // 显示加载状态
        loginSubmit.disabled = true;
        loginSubmit.classList.add('btn-loading');
        loginText.textContent = '登录中...';

        // 模拟登录请求（实际应用中应调用API）
        setTimeout(function() {
          // 保存登录状态
          localStorage.setItem('authUser', username);
          
          // 恢复按钮状态
          loginSubmit.disabled = false;
          loginSubmit.classList.remove('btn-loading');
          loginText.textContent = '登录';

          // 显示主内容
          showMainContent(username);
        }, 800);
      });

      // 登出处理
      logoutBtn.addEventListener('click', function() {
        localStorage.removeItem('authUser');
        showLogin();
      });

      // 统计面板功能
      const statFloat = document.getElementById('stat-float');
      const statToggle = document.getElementById('stat-toggle');
      const statPanel = document.getElementById('stat-panel');
      const statClose = document.getElementById('stat-close');
      let statLoaded = false;

      function openStatPanel() {
        statFloat.classList.remove('collapsed');
        statPanel.style.display = 'block';
        statToggle.setAttribute('aria-expanded', 'true');
        
        if (!statLoaded) {
          const script = document.createElement('script');
          script.id = 'LA-DATA-WIDGET';
          script.src = 'https://v6-widget.51.la/v6/3OVoIvCjhMMCOjuH/quote.js?theme=#1690FF,#333333,#999999,#010E10,#FDFDFD,#1690FF,14&col=true&f=14&badge=icon_0&icon=center';
          script.charset = 'UTF-8';
          script.crossOrigin = 'anonymous';
          document.getElementById('stat-content').appendChild(script);
          statLoaded = true;
        }
      }

      function closeStatPanel() {
        statFloat.classList.add('collapsed');
        statPanel.style.display = 'none';
        statToggle.setAttribute('aria-expanded', 'false');
      }

      statToggle.addEventListener('click', function(e) {
        e.stopPropagation();
        if (statFloat.classList.contains('collapsed')) {
          openStatPanel();
        } else {
          closeStatPanel();
        }
      });

      statClose.addEventListener('click', function(e) {
        e.stopPropagation();
        closeStatPanel();
      });

      document.addEventListener('click', function(e) {
        if (!statFloat.contains(e.target) && !statFloat.classList.contains('collapsed')) {
          closeStatPanel();
        }
      });

      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && !statFloat.classList.contains('collapsed')) {
          closeStatPanel();
        }
      });

      // 初始化
      checkAuth();
    })();
  </script>
</body>
</html>
